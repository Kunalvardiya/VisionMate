[project]
name = "visionmate-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "opencv-python-headless",
  "numpy",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff", "pyright"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["app"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
